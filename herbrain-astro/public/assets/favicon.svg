<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- HerBrain tree icon - green hexagons with stem -->
  
  <!-- Main dark green hexagons (filled) -->
  <!-- Large center hexagon -->
  <polygon points="40,35 52,28 64,35 64,49 52,56 40,49" fill="#3d7a6b" stroke="#2d5a4f" stroke-width="1"/>
  
  <!-- Upper right large hexagon -->
  <polygon points="58,22 70,15 82,22 82,36 70,43 58,36" fill="#3d7a6b" stroke="#2d5a4f" stroke-width="1"/>
  
  <!-- Right hexagon -->
  <polygon points="64,45 76,38 88,45 88,59 76,66 64,59" fill="#3d7a6b" stroke="#2d5a4f" stroke-width="1"/>
  
  <!-- Lower center hexagon -->
  <polygon points="40,52 52,45 64,52 64,66 52,73 40,66" fill="#3d7a6b" stroke="#2d5a4f" stroke-width="1"/>
  
  <!-- Left hexagon -->
  <polygon points="16,45 28,38 40,45 40,59 28,66 16,59" fill="#3d7a6b" stroke="#2d5a4f" stroke-width="1"/>
  
  <!-- Lighter green hexagons (muted) -->
  <!-- Top left small -->
  <polygon points="22,25 30,20 38,25 38,35 30,40 22,35" fill="#6b9e91" stroke="none"/>
  
  <!-- Top center small -->
  <polygon points="46,12 54,7 62,12 62,22 54,27 46,22" fill="#6b9e91" stroke="none"/>
  
  <!-- Top right small -->
  <polygon points="72,8 78,4 84,8 84,16 78,20 72,16" fill="#6b9e91" stroke="none"/>
  
  <!-- Far right small -->
  <polygon points="82,32 88,28 94,32 94,40 88,44 82,40" fill="#6b9e91" stroke="none"/>
  
  <!-- Bottom left small -->
  <polygon points="8,58 14,54 20,58 20,66 14,70 8,66" fill="#6b9e91" stroke="none"/>
  
  <!-- Very small accents -->
  <polygon points="30,8 35,5 40,8 40,14 35,17 30,14" fill="#6b9e91" stroke="none"/>
  <polygon points="6,42 10,39 14,42 14,48 10,51 6,48" fill="#6b9e91" stroke="none"/>
  
  <!-- Tree stem -->
  <path d="M 48,68 Q 45,78 38,88 Q 36,92 40,92 Q 50,85 52,73" fill="#3d7a6b" stroke="none"/>
</svg>
